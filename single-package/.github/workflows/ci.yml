name: CI
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  checks: write
  pull-requests: write
  id-token: write
  pages: write

jobs:
  build:
    uses: michaelglass/FSharpOssTooling/.github/workflows/reusable-build.yml@main
    with:
      solution: MyLib.slnx
      fantomas-paths: "src/ tests/ examples/"
      has-examples: true
    permissions:
      contents: read
      checks: write
      pull-requests: write

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    uses: michaelglass/FSharpOssTooling/.github/workflows/reusable-release.yml@main
    with:
      package-name: MyLib
      tag-prefix: v
      fsproj-path: src/MyLib/MyLib.fsproj
    permissions:
      contents: write
      id-token: write

  deploy-docs:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')
    needs: build
    uses: michaelglass/FSharpOssTooling/.github/workflows/reusable-docs.yml@main
    with:
      fsdocs-parameters: "--parameters root /MyLib/"
    permissions:
      contents: read
      pages: write
      id-token: write
