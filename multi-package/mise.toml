[tools]
# Pin the SDK. Unpinned, a local run compiles with whatever dotnet happens to be
# on PATH while CI installs the band ci.yml passes as `dotnet-version` (10.0.4xx).
# Keep this, global.json's `sdk.version` and ci.yml in step — they must not drift.
dotnet = "10.0.400"

[tasks.tool-restore]
description = "Restore the local dotnet tools"
run = "dotnet tool restore"

[tasks.build]
description = "Build the solution"
run = "dotnet build MyLib.slnx"
depends = ["tool-restore"]

[tasks.test]
description = "Run tests"
run = "dotnet test --solution MyLib.slnx"

[tasks.test-coverage]
description = "Run each test project and emit cobertura where the coverage ratchet reads it"
# One test project per package, one coverage directory per test project, one
# coverage-ratchet-<pkg>.json per coverage directory. The reusable CI workflow
# derives the directory name from the test project folder minus ".Tests" and then
# cds into coverage/<name> for every coverage-ratchet-*.json at the root — a
# ratchet config with no matching test project fails that step.
run = """
dotnet test --project tests/MyLib.Tests/MyLib.Tests.fsproj \
  --coverage \
  --coverage-output-format cobertura \
  --coverage-output "$PWD/coverage/MyLib/coverage.cobertura.xml"
dotnet test --project tests/MyLib.Extension.Tests/MyLib.Extension.Tests.fsproj \
  --coverage \
  --coverage-output-format cobertura \
  --coverage-output "$PWD/coverage/MyLib.Extension/coverage.cobertura.xml"
"""

[tasks.coverage-check]
description = "Check per-file coverage against each coverage-ratchet-*.json"
run = """
(cd coverage/MyLib && dotnet tool run coverageratchet check ../../coverage-ratchet-MyLib.json)
(cd coverage/MyLib.Extension && dotnet tool run coverageratchet check ../../coverage-ratchet-MyLib.Extension.json)
"""
depends = ["test-coverage"]

[tasks.coverage-ratchet]
description = "Tighten the coverage floors to current values"
run = """
(cd coverage/MyLib && dotnet tool run coverageratchet ratchet ../../coverage-ratchet-MyLib.json)
(cd coverage/MyLib.Extension && dotnet tool run coverageratchet ratchet ../../coverage-ratchet-MyLib.Extension.json)
"""
depends = ["test-coverage"]

[tasks.coverage-loosen]
description = "Add floors for this platform from current coverage (a file with no entry defaults to 100%/100%)"
run = """
(cd coverage/MyLib && dotnet tool run coverageratchet loosen ../../coverage-ratchet-MyLib.json)
(cd coverage/MyLib.Extension && dotnet tool run coverageratchet loosen ../../coverage-ratchet-MyLib.Extension.json)
"""
depends = ["test-coverage"]

[tasks.format]
description = "Format with Fantomas"
run = "dotnet fantomas src/ tests/ examples/"

[tasks.format-check]
description = "Check formatting without rewriting"
run = "dotnet fantomas --check src/ tests/ examples/"

[tasks.lint]
description = "Run FSharpLint"
run = "dotnet fsharplint lint MyLib.slnx"

[tasks.lint-project]
description = "Lint repo + fsproj structure for NuGet OSS readiness (the same tool CI's lint-project job runs)"
run = "dotnet tool run fsprojlint"
depends = ["tool-restore"]

[tasks.sync-docs]
description = "Sync README sections into docs/ (README.md -> docs/index.md, src/<Pkg>/README.md -> docs/<Pkg>/index.md)"
run = "dotnet tool run syncdocs sync"

[tasks.sync-docs-check]
description = "Fail if docs/ is out of sync with the READMEs"
run = "dotnet tool run syncdocs check"

[tasks.docs]
description = "Generate API documentation"
run = "dotnet fsdocs build --parameters root /MyLib/"

[tasks.check]
description = "Run all checks with auto-fix"
depends = ["format", "sync-docs", "lint", "lint-project", "build", "coverage-check", "docs"]

[tasks.ci]
description = "Run every check CI runs, in CI's order, with no auto-fix"
# Keep this in step with .github/workflows/ci.yml. A local `ci` that runs a
# different set from real CI can go green on work CI will reject — which is the
# whole reason fsprojlint is here as well as a job in the workflow.
run = [
  "dotnet tool restore",
  "dotnet restore",
  "dotnet fantomas --check src/ tests/ examples/",
  "dotnet tool run syncdocs check",
  "dotnet build MyLib.slnx --warnaserror --no-restore",
  "dotnet fsharplint lint MyLib.slnx",
  "dotnet fsdocs build --output output/docs --clean",
  'dotnet test --project tests/MyLib.Tests/MyLib.Tests.fsproj --coverage --coverage-output-format cobertura --coverage-output "$PWD/coverage/MyLib/coverage.cobertura.xml"',
  'dotnet test --project tests/MyLib.Extension.Tests/MyLib.Extension.Tests.fsproj --coverage --coverage-output-format cobertura --coverage-output "$PWD/coverage/MyLib.Extension/coverage.cobertura.xml"',
  "(cd coverage/MyLib && dotnet tool run coverageratchet check ../../coverage-ratchet-MyLib.json)",
  "(cd coverage/MyLib.Extension && dotnet tool run coverageratchet check ../../coverage-ratchet-MyLib.Extension.json)",
  "dotnet tool run fsprojlint",
]

[tasks.pack]
description = "Create the NuGet packages (RefStamp suffixes a local pack with the jj/git source ref)"
run = """
dotnet pack src/MyLib/MyLib.fsproj -c Release -o artifacts/
dotnet pack src/MyLib.Extension/MyLib.Extension.fsproj -c Release -o artifacts/
"""

[tasks.release]
description = "Tag a release per changed package; the bump level is derived from the public API diff"
run = "dotnet tool run fssemantictagger release"
depends = ["ci"]

[tasks.release-dry-run]
description = "Preview a release without mutating (no tag, no publish)"
run = "dotnet tool run fssemantictagger release --dry-run"

[tasks.release-alpha]
description = "Start a new alpha pre-release cycle"
run = "dotnet tool run fssemantictagger alpha"

[tasks.changelog-check]
description = "Fail if a changed package's '## Unreleased' CHANGELOG section cannot support a release"
run = "dotnet tool run fssemantictagger release --check"
